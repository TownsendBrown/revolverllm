<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges" role="img" aria-label="Servers">
  <title>Servers</title>

  <defs>
    <g id="rack-unit">
      <!-- top face -->
      <rect x="3" y="0" width="14" height="1" fill="#98a0a8"/>
      <rect x="2" y="1" width="16" height="1" fill="#98a0a8"/>
      <rect x="1" y="2" width="18" height="1" fill="#b4bec3"/>
      <rect x="0" y="3" width="20" height="1" fill="#b4bec3"/>
      <rect x="20" y="0" width="2" height="1" fill="#767e86"/>
      <rect x="21" y="1" width="1" height="1" fill="#767e86"/>
      <rect x="22" y="2" width="1" height="2" fill="#4a4e54"/>

      <!-- front chassis -->
      <rect x="0" y="4" width="21" height="6" fill="#767e86"/>
      <rect x="0" y="4" width="21" height="1" fill="#000000"/>
      <rect x="0" y="4" width="1" height="6" fill="#000000"/>
      <rect x="20" y="5" width="1" height="5" fill="#000000"/>
      <rect x="0" y="9" width="21" height="1" fill="#000000"/>

      <!-- right side -->
      <rect x="21" y="4" width="2" height="6" fill="#2e333a"/>
      <rect x="23" y="4" width="1" height="6" fill="#1a1a1a"/>

      <!-- vent grille -->
      <rect x="3" y="6" width="8" height="1" fill="#1a1a1a"/>
      <rect x="3" y="7" width="8" height="1" fill="#1a1a1a"/>
      <rect x="3" y="8" width="8" height="1" fill="#1a1a1a"/>

      <!-- drive bays -->
      <rect x="12" y="6" width="3" height="2" fill="#1a1a1a"/>
      <rect x="16" y="6" width="3" height="2" fill="#1a1a1a"/>

      <!-- status: power / disk -->
      <rect x="1" y="5" width="1" height="1" fill="#33ff33"/>
      <rect x="1" y="7" width="1" height="1" fill="#ff9933"/>

      <!-- IRIX-style link bar -->
      <rect x="21" y="5" width="1" height="3" fill="#4ec9b0"/>
    </g>
  </defs>

  <!-- outer bevel -->
  <rect width="48" height="48" fill="#c0c0c0"/>
  <rect x="1" y="1" width="46" height="46" fill="#ece9d8"/>
  <rect x="1" y="1" width="46" height="1" fill="#ffffff"/>
  <rect x="1" y="1" width="1" height="46" fill="#ffffff"/>
  <rect x="2" y="45" width="44" height="1" fill="#808080"/>
  <rect x="45" y="2" width="1" height="44" fill="#808080"/>

  <!-- inner panel -->
  <rect x="4" y="4" width="40" height="30" fill="#ece9d8"/>
  <rect x="4" y="4" width="40" height="1" fill="#808080"/>
  <rect x="4" y="4" width="1" height="30" fill="#808080"/>
  <rect x="43" y="5" width="1" height="28" fill="#ffffff"/>
  <rect x="5" y="33" width="38" height="1" fill="#ffffff"/>

  <!-- rack rails -->
  <rect x="7" y="6" width="1" height="26" fill="#808080"/>
  <rect x="7" y="6" width="1" height="1" fill="#ffffff"/>
  <rect x="7" y="31" width="1" height="1" fill="#4a4658"/>
  <rect x="40" y="6" width="1" height="26" fill="#808080"/>
  <rect x="40" y="6" width="1" height="1" fill="#ffffff"/>
  <rect x="40" y="31" width="1" height="1" fill="#4a4658"/>

  <!-- stacked units: isometric offset -->
  <use href="#rack-unit" x="10" y="7"/>
  <use href="#rack-unit" x="11" y="15"/>
  <use href="#rack-unit" x="12" y="23"/>

  <!-- footer -->
  <rect x="3" y="36" width="42" height="9" fill="#ece9d8"/>
  <rect x="3" y="36" width="42" height="1" fill="#808080"/>
  <rect x="3" y="36" width="1" height="9" fill="#808080"/>
  <rect x="44" y="37" width="1" height="7" fill="#ffffff"/>
  <rect x="4" y="44" width="40" height="1" fill="#ffffff"/>
  <text x="24" y="42" text-anchor="middle" dominant-baseline="middle" font-family="Courier New, monospace" font-size="5" font-weight="700" fill="#000000">server</text>
</svg>
