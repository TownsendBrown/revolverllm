<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges" role="img" aria-label="Chat">
  <title>Chat</title>

  <!-- outer bevel -->
  <rect width="48" height="48" fill="#c0c0c0"/>
  <rect x="1" y="1" width="46" height="46" fill="#ece9d8"/>
  <rect x="1" y="1" width="46" height="1" fill="#ffffff"/>
  <rect x="1" y="1" width="1" height="46" fill="#ffffff"/>
  <rect x="2" y="45" width="44" height="1" fill="#808080"/>
  <rect x="45" y="2" width="1" height="44" fill="#808080"/>

  <!-- inner panel -->
  <rect x="4" y="4" width="40" height="30" fill="#ece9d8"/>
  <rect x="4" y="4" width="40" height="1" fill="#808080"/>
  <rect x="4" y="4" width="1" height="30" fill="#808080"/>
  <rect x="43" y="5" width="1" height="28" fill="#ffffff"/>
  <rect x="5" y="33" width="38" height="1" fill="#ffffff"/>

  <!-- bubble 1: sky blue -->
  <rect x="6" y="6" width="24" height="9" fill="#a8d4f0"/>
  <rect x="6" y="6" width="24" height="1" fill="#d8ecff"/>
  <rect x="6" y="6" width="1" height="9" fill="#d8ecff"/>
  <rect x="29" y="7" width="1" height="8" fill="#5a8cb0"/>
  <rect x="7" y="14" width="22" height="1" fill="#5a8cb0"/>
  <rect x="6" y="14" width="1" height="1" fill="#3a6080"/>
  <rect x="7" y="8" width="14" height="1" fill="#1a3048"/>
  <rect x="7" y="10" width="18" height="1" fill="#1a3048"/>
  <rect x="7" y="12" width="10" height="1" fill="#1a3048"/>

  <!-- bubble 2: mint green, right -->
  <rect x="22" y="16" width="20" height="7" fill="#98d8b8"/>
  <rect x="22" y="16" width="20" height="1" fill="#c8f0d8"/>
  <rect x="22" y="16" width="1" height="7" fill="#c8f0d8"/>
  <rect x="41" y="17" width="1" height="6" fill="#4a9870"/>
  <rect x="23" y="22" width="18" height="1" fill="#4a9870"/>
  <rect x="24" y="18" width="12" height="1" fill="#1a4030"/>
  <rect x="24" y="20" width="8" height="1" fill="#1a4030"/>

  <!-- bubble 3: sky blue -->
  <rect x="8" y="24" width="22" height="8" fill="#a8d4f0"/>
  <rect x="8" y="24" width="22" height="1" fill="#d8ecff"/>
  <rect x="8" y="24" width="1" height="8" fill="#d8ecff"/>
  <rect x="29" y="25" width="1" height="7" fill="#5a8cb0"/>
  <rect x="9" y="31" width="20" height="1" fill="#5a8cb0"/>
  <rect x="8" y="31" width="1" height="1" fill="#3a6080"/>
  <rect x="9" y="26" width="16" height="1" fill="#1a3048"/>
  <rect x="9" y="28" width="14" height="1" fill="#1a3048"/>
  <rect x="9" y="30" width="6" height="1" fill="#1a3048"/>

  <!-- footer -->
  <rect x="3" y="36" width="42" height="9" fill="#ece9d8"/>
  <rect x="3" y="36" width="42" height="1" fill="#808080"/>
  <rect x="3" y="36" width="1" height="9" fill="#808080"/>
  <rect x="44" y="37" width="1" height="7" fill="#ffffff"/>
  <rect x="4" y="44" width="40" height="1" fill="#ffffff"/>
  <text x="24" y="42" text-anchor="middle" dominant-baseline="middle" font-family="Courier New, monospace" font-size="5" font-weight="700" fill="#000000">chat</text>
</svg>
