<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges" role="img" aria-label="System monitor">
  <title>System monitor</title>

  <!-- outer bevel-out -->
  <rect width="48" height="48" fill="#c0c0c0"/>
  <rect x="1" y="1" width="46" height="46" fill="#ece9d8"/>
  <rect x="1" y="1" width="46" height="1" fill="#ffffff"/>
  <rect x="1" y="1" width="1" height="46" fill="#ffffff"/>
  <rect x="2" y="45" width="44" height="1" fill="#808080"/>
  <rect x="45" y="2" width="1" height="44" fill="#808080"/>

  <!-- CPU -->
  <text x="3" y="7" font-family="Courier New, monospace" font-size="4" font-weight="700" fill="#000000">CPU</text>
  <rect x="3" y="8" width="28" height="12" fill="#0a0a0a"/>
  <rect x="3" y="8" width="28" height="1" fill="#808080"/>
  <rect x="3" y="8" width="1" height="12" fill="#808080"/>
  <rect x="30" y="9" width="1" height="10" fill="#ffffff"/>
  <rect x="4" y="19" width="26" height="1" fill="#ffffff"/>
  <polyline points="4,18 5,16 6,17 7,14 8,15 9,13 10,14 11,12 12,13 13,11 14,12 15,10 16,11 17,10 18,11 19,9 20,10 21,11 22,10 23,12 24,11 25,13 26,12 27,14 28,13 29,15 30,14" fill="none" stroke="#33ff33" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- MEM -->
  <text x="33" y="7" font-family="Courier New, monospace" font-size="4" font-weight="700" fill="#000000">MEM</text>
  <rect x="33" y="8" width="12" height="12" fill="#0a0a0a"/>
  <rect x="33" y="8" width="12" height="1" fill="#808080"/>
  <rect x="33" y="8" width="1" height="12" fill="#808080"/>
  <rect x="44" y="9" width="1" height="10" fill="#ffffff"/>
  <rect x="34" y="19" width="10" height="1" fill="#ffffff"/>
  <rect x="34" y="18" width="10" height="1" fill="#33ff33"/>
  <rect x="34" y="17" width="10" height="1" fill="#33ff33"/>
  <rect x="34" y="16" width="10" height="1" fill="#33ff33"/>
  <rect x="34" y="15" width="10" height="1" fill="#33ff33"/>
  <rect x="34" y="14" width="10" height="1" fill="#c8b4ff"/>
  <rect x="34" y="13" width="10" height="1" fill="#c8b4ff"/>
  <rect x="34" y="12" width="10" height="1" fill="#c8b4ff"/>
  <rect x="34" y="11" width="10" height="1" fill="#c8b4ff"/>
  <rect x="34" y="10" width="10" height="1" fill="#c8b4ff"/>
  <rect x="34" y="9" width="10" height="1" fill="#c8b4ff"/>

  <!-- LOAD -->
  <text x="3" y="24" font-family="Courier New, monospace" font-size="4" font-weight="700" fill="#000000">LOAD</text>
  <rect x="3" y="25" width="28" height="9" fill="#0a0a0a"/>
  <rect x="3" y="25" width="28" height="1" fill="#808080"/>
  <rect x="3" y="25" width="1" height="9" fill="#808080"/>
  <rect x="30" y="26" width="1" height="7" fill="#ffffff"/>
  <rect x="4" y="33" width="26" height="1" fill="#ffffff"/>
  <polyline points="4,32 5,31 6,32 7,30 8,31 9,29 10,30 11,29 12,30 13,28 14,29 15,28 16,29 17,28 18,29 19,27 20,28 21,29 22,28 23,29 24,28 25,29 26,28 27,29 28,28 29,29 30,28" fill="none" stroke="#c8b4ff" stroke-width="1" stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- SWAP -->
  <text x="33" y="24" font-family="Courier New, monospace" font-size="4" font-weight="700" fill="#000000">SWAP</text>
  <rect x="33" y="25" width="12" height="9" fill="#0a0a0a"/>
  <rect x="33" y="25" width="12" height="1" fill="#808080"/>
  <rect x="33" y="25" width="1" height="9" fill="#808080"/>
  <rect x="44" y="26" width="1" height="7" fill="#ffffff"/>
  <rect x="34" y="33" width="10" height="1" fill="#ffffff"/>
  <rect x="34" y="32" width="10" height="1" fill="#c8b4ff"/>
  <rect x="34" y="31" width="10" height="1" fill="#c8b4ff"/>

  <!-- footer -->
  <rect x="3" y="36" width="42" height="9" fill="#ece9d8"/>
  <rect x="3" y="36" width="42" height="1" fill="#808080"/>
  <rect x="3" y="36" width="1" height="9" fill="#808080"/>
  <rect x="44" y="37" width="1" height="7" fill="#ffffff"/>
  <rect x="4" y="44" width="40" height="1" fill="#ffffff"/>
  <text x="24" y="42" text-anchor="middle" dominant-baseline="middle" font-family="Courier New, monospace" font-size="5" font-weight="700" fill="#000000">Monitor</text>
</svg>
